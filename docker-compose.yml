services:
  postgres:
    image: postgres:16-alpine
    container_name: subs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: subs
      POSTGRES_PASSWORD: subs
      POSTGRES_DB: subscriptions
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
